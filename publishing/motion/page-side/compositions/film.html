          <video id="ps-vid-full" class="clip" src="assets/app/turn-full.mp4" data-start="9.4" data-duration="2.9" data-media-start="1.3" data-track-index="3" muted playsinline></video>

  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      // Phone screen geometry: the 1080x2400 recording drawn 600 px wide at (240, 520).
      const S = 600 / 1080, SX = 240, SY = 520;
      const pt = (sx, sy) => [SX + sx * S, SY + sy * S];
      // Camera: scale k about origin 0,0, placing source point (sx, sy) at canvas point (tx, ty).
      const cam = (k, sx, sy, tx, ty) => { const [px, py] = pt(sx, sy); return { scale: k, x: tx - k * px, y: ty - k * py }; };

      const BADGE = [540, 169];          // page badge in the header (source px)
      const EDGE_R = [1068, 1200];       // full-screen side marker, right edge
      const EDGE_L = [12, 1200];         // full-screen side marker, left edge
      const SET_ROW = [540, 1780];       // «إشارة اتجاه الصفحة» row in settings

      const words = (sel, at) => tl.fromTo(`${sel} .w`, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.08, ease: "power4.out" }, at);
      const lineIn = (sel, at) => tl.fromTo(`${sel} p`, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, at);
      const out = (sel, at) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in" }, at);

      tl.set("#ps-screen", { filter: "blur(0px)" }, 0);
      tl.set("#ps-hl", { opacity: 0 }, 0);
      tl.set(".ps-mk", { opacity: 0 }, 0);

      // ---- HOOK: question on frame 0, the paper mushaf draws in under it
      tl.set("#ps-t-hook .w", { opacity: 1, filter: "blur(0px)" }, 0);
      tl.fromTo("#ps-leaf-r", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, 0.15);
      tl.fromTo("#ps-leaf-l", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, 0.3);
      // right leaf lights, then the left
      tl.fromTo("#ps-tint-r", { opacity: 0 }, { opacity: 0.16, duration: 0.3, ease: "power2.out" }, 0.75);
      tl.fromTo("#ps-cap-r", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.8);
      tl.to("#ps-tint-r", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 1.55);
      tl.fromTo("#ps-tint-l", { opacity: 0 }, { opacity: 0.16, duration: 0.3, ease: "power2.out" }, 1.55);
      tl.fromTo("#ps-cap-l", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 1.6);
      tl.to("#ps-tint-l", { opacity: 0, duration: 0.25, ease: "power2.inOut" }, 2.35);
      tl.fromTo("#ps-tint-r", { opacity: 0 }, { opacity: 0.16, duration: 0.25, ease: "power2.out", immediateRender: false }, 2.35);
      out("#ps-t-hook", 2.5);
      tl.to(["#ps-cap-r", "#ps-cap-l"], { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in" }, 2.5);

      // ---- MATCH: the drawn mushaf shrinks into the app's page badge
      const START = cam(2.4, BADGE[0], BADGE[1], 540, 820);
      tl.set("#ps-cam", START, 0);
      tl.set("#ps-phone", { opacity: 0 }, 0);
      tl.fromTo("#ps-book-in", { scale: 1, x: 0, y: 0 }, { scale: 0.46, x: 0, y: 820 - 890, duration: 0.7, ease: "power2.inOut" }, 2.65);
      tl.to("#ps-phone", { opacity: 1, duration: 0.35, ease: "power2.out" }, 2.95);
      tl.to("#ps-book-in", { opacity: 0, duration: 0.25, ease: "power2.in" }, 3.25);

      // ---- HEADER: the app turns 293 → 294 → 295
      lineIn("#ps-t-293", 3.2); words("#ps-t-293", 3.25); out("#ps-t-293", 4.2);
      lineIn("#ps-t-294", 4.75); words("#ps-t-294", 4.8);
      // pull back for context while 294 sits, then push in again before the next turn
      tl.to("#ps-cam", { ...cam(1.18, 540, 1200, 540, 1383), duration: 0.8, ease: "power2.inOut" }, 5.9);
      tl.to("#ps-cam", { ...START, duration: 0.7, ease: "power2.inOut" }, 7.1);
      out("#ps-t-294", 7.85);
      lineIn("#ps-t-295", 8.45); words("#ps-t-295", 8.5);
      out("#ps-t-295", 9.2);

      // ---- FULL SCREEN: the edge marker, right then left
      tl.set("#ps-cam", cam(2.1, EDGE_R[0], EDGE_R[1], 870, 1060), 9.4);
      tl.fromTo("#ps-screen", { filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.2, ease: "power2.out", immediateRender: false }, 9.4);
      tl.fromTo("#ps-mk-r", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out", immediateRender: false }, 9.6);
      tl.to("#ps-mk-r", { opacity: 0, duration: 0.15, ease: "power3.in" }, 10.15);
      tl.fromTo("#ps-mk-l", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out", immediateRender: false }, 11.05);
      lineIn("#ps-t-full-r", 9.45); words("#ps-t-full-r", 9.5);
      out("#ps-t-full-r", 10.45);
      tl.to("#ps-cam", { ...cam(2.1, EDGE_L[0], EDGE_L[1], 210, 1060), duration: 0.85, ease: "power2.inOut" }, 10.2);
      tl.set("#ps-t-full-l p", { opacity: 1 }, 10.7);
      words("#ps-t-full-l", 10.75);
      out("#ps-t-full-l", 12.0);

      // ---- SETTINGS: where to switch it on
      tl.set("#ps-cam", cam(1.75, SET_ROW[0], SET_ROW[1], 540, 1080), 12.2);
      tl.fromTo("#ps-screen", { filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.2, ease: "power2.out", immediateRender: false }, 12.2);
      tl.fromTo("#ps-hl", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out", immediateRender: false }, 12.45);
      lineIn("#ps-t-set", 12.25); words("#ps-t-set", 12.3);
      out("#ps-t-set", 13.15);
      tl.to("#ps-phone", { opacity: 0, filter: "blur(12px)", duration: 0.22, ease: "power3.in" }, 13.1);

      // ---- END
      words("#ps-end", 13.35);
      tl.fromTo("#ps-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 13.7);
      tl.fromTo("#ps-end-sub", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 13.85);

      window.__timelines["film"] = tl;
    })();
  </script>
